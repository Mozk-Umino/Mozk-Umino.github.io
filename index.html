<style>
:root{--bg:#f6f7f5;--card:#fff;--text:#1f2a24;--sub:#5c6b62;--line:#dfe5e0;--accent:#2f6b4f}
@media (prefers-color-scheme:dark){:root{--bg:#141816;--card:#1d2320;--text:#e6ece8;--sub:#9aa8a0;--line:#2c3530;--accent:#7fc4a2}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.6}
main{max-width:480px;margin:0 auto;padding:32px 16px 48px}
header{text-align:center;margin-bottom:28px}
header img{width:96px;height:96px;border-radius:50%;object-fit:cover}
h1{font-size:1.4rem;margin:12px 0 6px}
header p{margin:0;color:var(--sub);font-size:.92rem}
h2{font-size:.85rem;color:var(--sub);margin:24px 0 8px;letter-spacing:.05em}
a.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;color:inherit;text-decoration:none;overflow-wrap:anywhere}
a.card:hover,a.card:focus-visible{border-color:var(--accent)}
a.card b{display:block;color:var(--accent)}
a.card span{font-size:.85rem;color:var(--sub)}
</style>
</head>
<body>
<main>
  <header>
    <img src="icon.jpg" alt="もずく・らてっくすのアイコン">
    <h1>もずく・らてっくす</h1>
    <p>Kindleセール本の紹介サイトを運営しています。ブログでは自作ツールやAI、日常のことを書いています</p>
  </header>
  <div id="list"></div>
</main>
<script>
const el = (tag, props, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids); return e; };
const list = document.getElementById('list');
for (const s of JSON.parse(document.getElementById('links').textContent)) {
  list.append(el('h2', {textContent: s.section}));
  for (const i of s.items) {
    list.append(el('a', {className: 'card', href: i.url, target: '_blank', rel: 'noopener'},
      el('b', {textContent: i.name}), ...(i.desc ? [el('span', {textContent: i.desc})] : [])));
  }
}
</script>
</body>
</html>
